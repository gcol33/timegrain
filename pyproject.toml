[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "climgrain"
version = "0.3.0"
description = "Temporal climate resolution for ecological prediction"
readme = "python/README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Gilles Colling", email = "gilles.colling051@gmail.com" }]
# Windows ships no IANA database for zoneinfo, and a zone is what the binning of a zoned
# record is read through.
dependencies = ["numpy>=1.24", "tzdata; platform_system == 'Windows'"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
sklearn = ["scikit-learn>=1.3"]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://gillescolling.com/climgrain/"
Source = "https://github.com/gcol33/climgrain"
Issues = "https://github.com/gcol33/climgrain/issues"

[tool.scikit-build]
minimum-version = "0.10"
wheel.packages = ["python/climgrain"]
sdist.include = [
  "CMakeLists.txt",
  "src/cg_core.cpp",
  "src/cg_calendar.cpp",
  "src/cg_core.h",
  "python/cg_py.cpp",
  "python/tests/**",
  "inst/spec/**",
  "LICENSE",
]
sdist.exclude = [
  "R/",
  "man/",
  "tests/",
  "tools/",
  "vignettes/",
  "build_site.R",
  "inst/reproduce/",
  "dev_notes/",
  "docs/",
  "src/cpp11.cpp",
  "src/cg_r.cpp",
  "DESCRIPTION",
  "NAMESPACE",
  "NEWS.md",
  "CLAUDE.md",
  "_pkgdown.yml",
  ".Rbuildignore",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
