[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timegrain"
version = "0.1.0"
description = "Temporal grain selection for ecological prediction from sensor time series"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Gilles Colling", email = "gilles.colling051@gmail.com" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
sklearn = ["scikit-learn>=1.8"]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://gillescolling.com/timegrain/"
Source = "https://github.com/gcol33/timegrain"
Issues = "https://github.com/gcol33/timegrain/issues"

[tool.hatch.build.targets.wheel]
packages = ["timegrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
